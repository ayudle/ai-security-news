<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ページが見つかりません | AI×セキュリティ ニュース日報</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f0d;--text:#e6e4dc;--muted:#98968e;--dim:#8c8a82;--border:#2a2a28;--accent:#378ADD;--card:#1a1a18}
body{font-family:-apple-system,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:15px;min-height:100vh}
a{color:inherit;text-decoration:none}
header{border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center}
.logo-link{display:inline-flex;align-items:center}
.logo-link:hover .logo{color:var(--accent);transition:color .15s}
.logo{font-size:15px;font-weight:700;color:#fff;margin:0}
.wrap{max-width:640px;margin:80px auto;padding:0 24px;text-align:center}
.code{font-size:72px;font-weight:700;color:var(--border);letter-spacing:-.02em;line-height:1}
h2{font-size:20px;font-weight:600;color:var(--text);margin:16px 0 8px}
p{color:var(--muted);margin-bottom:32px;font-size:14px}
.links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.links a{color:var(--accent);padding:10px 18px;border:1px solid var(--border);border-radius:8px;font-size:13px;transition:border-color .15s}
.links a:hover{border-color:var(--accent)}
</style>
</head>
<body>
<header>
  <a href="/ai-security-news/" class="logo-link">
    <h1 class="logo">AI×セキュリティ ニュース日報</h1>

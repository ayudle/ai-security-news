name: X Post (本番投稿)

# X APIへの確認・投稿を行うワークフロー。
#
# 役割分担:
#   daily.yml          → --all --dry-run（3本候補一覧、投稿なし）
#   post_x_dry_run.yml → --slot --dry-run（スロット別生成、投稿なし）
#   post_x.yml         → mode=verify（アカウント確認のみ）/ mode=post（本番投稿）
#
# 必要な GitHub Secrets:
#   X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET

on:
  # schedule は初回 mode=verify → mode=post の確認後に有効化すること
  # schedule:
  #   - cron: '30 23 * * *'  # 08:30 JST (morning)
  #   - cron: '30 3 * * *'   # 12:30 JST (noon)
  #   - cron: '0 10 * * *'   # 19:00 JST (evening)
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード（verify=アカウント確認のみ / post=本番投稿）'
        required: true
        default: 'verify'
        type: choice
        options:
          - verify
          - post
      slot:
        description: '投稿スロット（mode=post のときのみ有効）'
        required: false
        default: 'morning'
        type: choice
        options:
          - morning
          - noon
          - evening
      force:
        description: '強制再投稿（mode=post かつ既にposted済みでも投稿する）'
        required: false
        default: false
        type: boolean
      api_base:
        description: 'X API ベースURL（403切り分け用。通常は変更不要）'
        required: false
        default: 'https://api.x.com'
        type: choice
        options:
          - 'https://api.x.com'
          - 'https://api.twitter.com'

jobs:
  run-x:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests requests-oauthlib

      # ── mode=verify ──────────────────────────────────────────────────────
      - name: Verify account
        if: inputs.mode == 'verify'
        env:
          X_API_KEY:        ${{ secrets.X_API_KEY }}
          X_API_SECRET:     ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:   ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:  ${{ secrets.X_ACCESS_SECRET }}
          X_API_BASE_URL:   ${{ inputs.api_base }}
        run: |
          echo "=== アカウント確認モード ==="
          echo "投稿は行いません。"
          python scripts/generate_x_posts.py --verify-account

      # ── mode=post ────────────────────────────────────────────────────────
      - name: Validate slot (mode=post)
        if: inputs.mode == 'post'
        run: |
          SLOT="${{ inputs.slot }}"
          if [ -z "$SLOT" ]; then
            echo "[ERROR] mode=post のときは slot を指定してください。"
            exit 1
          fi
          echo "slot=$SLOT"

      - name: Post to X
        if: inputs.mode == 'post'
        env:
          X_API_KEY:        ${{ secrets.X_API_KEY }}
          X_API_SECRET:     ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:   ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:  ${{ secrets.X_ACCESS_SECRET }}
          X_API_BASE_URL:   ${{ inputs.api_base }}
        run: |
          SLOT="${{ inputs.slot }}"
          FORCE="${{ inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            python scripts/generate_x_posts.py --slot "$SLOT" --post --force
          else
            python scripts/generate_x_posts.py --slot "$SLOT" --post
          fi

      - name: Commit and push (mode=post のみ)
        if: inputs.mode == 'post'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SLOT="${{ inputs.slot }}"
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          git add docs/data/x_post_${SLOT}.json docs/data/x_post_history.json
          git diff --cached --quiet && echo "変更なし（スキップ or 変更なし）" && exit 0
          git commit -m "X post: ${TODAY} ${SLOT}"
          git push --force-with-lease

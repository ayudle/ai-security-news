name: X Post (本番投稿)

# X APIへの確認・投稿を行うワークフロー。
#
# 役割分担:
#   daily.yml  → --all --dry-run（3本候補一覧、投稿なし）
#   post_x.yml → mode=verify（アカウント確認のみ）/ mode=post（本番投稿）
#                / mode=post_daily_pick（1日1本運用）/ mode=test（テスト投稿）
#                schedule による daily-pick 自動投稿（20:30 JST）
#
# 必要な GitHub Secrets:
#   X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET

on:
  # 定期実行（schedule / cron）は無効化。手動実行（workflow_dispatch）のみ有効。
  # schedule:
  #   - cron: '30 11 * * *'  # 20:30 JST (daily-pick)
  # morning / noon / evening の定期投稿は有効化しない
  # - cron: '30 23 * * *'  # 08:30 JST (morning)
  # - cron: '30 3 * * *'   # 12:30 JST (noon)
  # - cron: '0 10 * * *'   # 19:00 JST (evening)
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード（verify=確認のみ / post=本番投稿 / post_daily_pick=1日1本投稿 / test=テスト投稿）'
        required: true
        default: 'verify'
        type: choice
        options:
          - verify
          - post
          - post_daily_pick
          - test
      slot:
        description: '投稿スロット（mode=post のときのみ有効）'
        required: false
        default: 'morning'
        type: choice
        options:
          - morning
          - noon
          - evening
      test_post:
        description: 'テスト投稿の種別（mode=test のときのみ有効）'
        required: false
        default: 'minimal'
        type: choice
        options:
          - minimal
          - no-url
          - with-url
      force:
        description: '強制再投稿（mode=post かつ既にposted済みでも投稿する）'
        required: false
        default: false
        type: boolean
      api_base:
        description: 'X API ベースURL（403切り分け用。通常は変更不要）'
        required: false
        default: 'https://api.x.com'
        type: choice
        options:
          - 'https://api.x.com'
          - 'https://api.twitter.com'

jobs:
  run-x:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests requests-oauthlib

      # ── schedule（自動実行）: daily-pick を投稿 ───────────────────────────
      - name: Post daily-pick (scheduled)
        if: github.event_name == 'schedule'
        env:
          X_API_KEY:        ${{ secrets.X_API_KEY }}
          X_API_SECRET:     ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:   ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:  ${{ secrets.X_ACCESS_SECRET }}
        run: |
          echo "=== schedule 自動投稿: daily-pick ==="
          python scripts/generate_x_posts.py --daily-pick --post

      - name: Commit and push (scheduled)
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          git add docs/data/x_post_daily_pick.json docs/data/x_post_history.json
          git diff --cached --quiet && echo "変更なし（スキップ or 変更なし）" && exit 0
          git commit -m "X daily-pick: ${TODAY} (scheduled)"
          git push --force-with-lease

      # ── mode=verify ──────────────────────────────────────────────────────
      - name: Verify account
        if: inputs.mode == 'verify'
        env:
          X_API_KEY:        ${{ secrets.X_API_KEY }}
          X_API_SECRET:     ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:   ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:  ${{ secrets.X_ACCESS_SECRET }}
          X_API_BASE_URL:   ${{ inputs.api_base }}
        run: |
          echo "=== アカウント確認モード ==="
          echo "投稿は行いません。"
          python scripts/generate_x_posts.py --verify-account

      # ── mode=test ────────────────────────────────────────────────────────
      - name: Test post to X
        if: inputs.mode == 'test'
        env:
          X_API_KEY:        ${{ secrets.X_API_KEY }}
          X_API_SECRET:     ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:   ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:  ${{ secrets.X_ACCESS_SECRET }}
          X_API_BASE_URL:   ${{ inputs.api_base }}
        run: |
          TEST_POST="${{ inputs.test_post }}"
          echo "=== テスト投稿モード: $TEST_POST ==="
          python scripts/generate_x_posts.py --test-post "$TEST_POST" --post

      - name: Commit and push (mode=test)
        if: inputs.mode == 'test'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          git add docs/data/x_post_history.json
          git diff --cached --quiet && echo "変更なし（スキップ or 変更なし）" && exit 0
          git commit -m "X test-post: ${TODAY} ${{ inputs.test_post }}"
          git push --force-with-lease

      # ── mode=post ────────────────────────────────────────────────────────
      - name: Validate slot (mode=post)
        if: inputs.mode == 'post'
        run: |
          SLOT="${{ inputs.slot }}"
          if [ -z "$SLOT" ]; then
            echo "[ERROR] mode=post のときは slot を指定してください。"
            exit 1
          fi
          echo "slot=$SLOT"

      - name: Post to X
        if: inputs.mode == 'post'
        env:
          X_API_KEY:        ${{ secrets.X_API_KEY }}
          X_API_SECRET:     ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:   ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:  ${{ secrets.X_ACCESS_SECRET }}
          X_API_BASE_URL:   ${{ inputs.api_base }}
        run: |
          SLOT="${{ inputs.slot }}"
          FORCE="${{ inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            python scripts/generate_x_posts.py --slot "$SLOT" --post --force
          else
            python scripts/generate_x_posts.py --slot "$SLOT" --post
          fi

      - name: Commit and push (mode=post のみ)
        if: inputs.mode == 'post'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SLOT="${{ inputs.slot }}"
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          git add docs/data/x_post_${SLOT}.json docs/data/x_post_history.json
          git diff --cached --quiet && echo "変更なし（スキップ or 変更なし）" && exit 0
          git commit -m "X post: ${TODAY} ${SLOT}"
          git push --force-with-lease

      # ── mode=post_daily_pick ─────────────────────────────────────────────
      - name: Post daily-pick to X
        if: inputs.mode == 'post_daily_pick'
        env:
          X_API_KEY:        ${{ secrets.X_API_KEY }}
          X_API_SECRET:     ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:   ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:  ${{ secrets.X_ACCESS_SECRET }}
          X_API_BASE_URL:   ${{ inputs.api_base }}
        run: |
          FORCE="${{ inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            python scripts/generate_x_posts.py --daily-pick --post --force
          else
            python scripts/generate_x_posts.py --daily-pick --post
          fi

      - name: Commit and push (mode=post_daily_pick)
        if: inputs.mode == 'post_daily_pick'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          git add docs/data/x_post_daily_pick.json docs/data/x_post_history.json
          git diff --cached --quiet && echo "変更なし（スキップ or 変更なし）" && exit 0
          git commit -m "X daily-pick: ${TODAY}"
          git push --force-with-lease

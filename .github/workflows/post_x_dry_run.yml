name: X Post Dry-Run

# スロットごとにX投稿文を生成・記録する（本番投稿なし）
# daily.yml の --all と役割分担：
#   daily.yml          → 当日3本候補を一覧生成（x_posts_daily.json）
#   post_x_dry_run.yml → 実投稿に近いスロット単位生成（x_post_{slot}.json + 履歴）

on:
  schedule:
    - cron: '30 23 * * *'  # 08:30 JST (morning)
    - cron: '30 3 * * *'   # 12:30 JST (noon)
    - cron: '0 10 * * *'   # 19:00 JST (evening)
  workflow_dispatch:
    inputs:
      slot:
        description: '投稿スロット'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - noon
          - evening

jobs:
  generate-x-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
          else
            # UTC 時刻でスロットを判定
            UTC_HOUR=$(date -u +%H)
            case "$UTC_HOUR" in
              23) SLOT="morning" ;;
              03) SLOT="noon" ;;
              10) SLOT="evening" ;;
              *)  SLOT="morning" ;;  # 予期しない起動は morning にフォールバック
            esac
          fi
          echo "slot=$SLOT" >> $GITHUB_OUTPUT
          echo "スロット: $SLOT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate X post (dry-run)
        run: |
          python scripts/generate_x_posts.py --slot ${{ steps.slot.outputs.slot }} --dry-run

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SLOT=${{ steps.slot.outputs.slot }}
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          git add docs/data/x_post_${SLOT}.json docs/data/x_post_history.json
          git diff --cached --quiet && echo "変更なし（重複スキップ）" && exit 0
          git commit -m "X post dry-run: ${TODAY} ${SLOT}"
          git push --force-with-lease

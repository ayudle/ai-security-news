name: Weekly AI Security Digest

on:
  schedule:
    - cron: '0 22 * * 0'  # 月曜 07:00 JST（日曜 22:00 UTC）
  workflow_dispatch:
    inputs:
      force:
        description: '既存の週次レポートがあっても再生成する（true/false）'
        required: false
        default: 'false'

jobs:
  generate-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/generate_weekly.py $FORCE_FLAG

      - name: Build website
        run: python scripts/build_site.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "変更なし" && exit 0
          WEEK_END=$(TZ=Asia/Tokyo date -d 'last sunday' '+%Y-%m-%d' 2>/dev/null || TZ=Asia/Tokyo date -v-sun '+%Y-%m-%d')
          git commit -m "Weekly digest: ${WEEK_END}"
          git push --force-with-lease
